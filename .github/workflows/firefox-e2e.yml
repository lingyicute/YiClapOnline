name: Firefox E2E 测试

# 每次提交 / PR 到默认分支时自动用真实 Firefox 跑端到端测试。
# 测试报告与逐步截图会上传为 Artifacts（即使失败也会保留，便于排查）。

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_network_tests:
        description: '跳过依赖在线音乐 API 的用例（冒烟模式: true/false）'
        required: false
        default: 'false'

# 同一分支上新提交到达时，取消还在跑的旧任务
concurrency:
  group: firefox-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-e2e:
    name: Firefox E2E（${{ matrix.firefox }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # 一个版本挂了不影响另一个版本
      matrix:
        firefox: [latest-esr, latest]   # 只跑一个版本的话保留一行即可

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 Mozilla 官方构建的 Firefox（非 snap 版），headless/驱动兼容性最稳
      - name: 安装 Firefox ${{ matrix.firefox }}
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: ${{ matrix.firefox }}

      - name: 确认 Firefox 版本
        run: firefox --version

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: 安装 Selenium
        run: pip install -r tests/requirements.txt

      # 无头容器没有声卡：给 ALSA 配一个空输出设备，
      # 否则 Firefox 音频流无法启动，<audio> 的 currentTime 永远停在 0
      - name: 配置虚拟声卡（ALSA null device）
        run: printf 'pcm.!default {\n  type null\n}\n' > ~/.asoundrc

      - name: 启动静态站点
        run: |
          nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory . > site.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/index.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::站点启动超时"
          exit 1

      - name: 运行 Firefox 测试
        env:
          BASE_URL: http://127.0.0.1:8000
          OUT_DIR: test-results
          HEADLESS: '1'
          SKIP_NETWORK_TESTS: ${{ github.event.inputs.skip_network_tests == 'true' && '1' || '0' }}
        run: python3 tests/e2e.py

      - name: 上传测试报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-e2e-${{ matrix.firefox }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: 在 Summary 中展示结果
        if: always()
        run: |
          echo "## Firefox E2E（${{ matrix.firefox }}）" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/report.json ]; then
            echo '| 测试项 | 结果 | 说明 |' >> "$GITHUB_STEP_SUMMARY"
            echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('test-results/report.json', encoding='utf-8'))
          for item in r['results']:
              mark = '🟡SKIP' if item.get('skipped') else ('✅PASS' if item['ok'] else '❌FAIL')
              detail = str(item['detail']).replace('|', '\\|')[:300].replace('\n', '<br>')
              print(f"| {item['test']} | {mark} | {detail} |")
          EOF
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "- 通过: $(python3 -c "import json;print(json.load(open('test-results/report.json',encoding='utf-8'))['pass'])")，失败: $(python3 -c "import json;print(json.load(open('test-results/report.json',encoding='utf-8'))['fail'])")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '未生成 report.json（测试进程可能提前崩溃）' >> "$GITHUB_STEP_SUMMARY"
          fi
